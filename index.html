<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lớp tôi đấy ☠️☠️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#141414;
    --ink:#F5F5F5;
    --ink-soft:#B8B8B8;
    --accent:#FF2D55;
    --accent-soft:#3A0E17;
    --line: rgba(255,255,255,0.14);
    --shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Comic Sans MS','Comic Sans',cursive;
    min-height:100vh;
    overflow-x:hidden;
  }
  a{color:inherit;}
  .sparkle-field{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .sparkle{
    position:absolute; font-size:1.4rem; opacity:.5;
    animation: drift 12s linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.5; }
    100%{ transform:translateY(110vh) translateX(-20px) rotate(180deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .sparkle{ animation:none; display:none; }
  }

  .wrap{ position:relative; z-index:1; max-width:960px; margin:0 auto; padding:0 20px 80px; }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:26px 4px 8px;
  }
  .brand{
    font-weight:700; font-size:1.05rem; color:var(--ink);
  }
  .mood-toggle{
    display:flex; align-items:center; gap:2px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:4px; box-shadow:var(--shadow);
  }
  .mood-toggle button{
    font-family:inherit; font-weight:700; font-size:.85rem;
    border:none; background:transparent; color:var(--ink-soft);
    padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: all .2s ease;
  }
  .mood-toggle button.active{
    background:var(--accent); color:#fff;
  }
  .hero{
    text-align:center; padding:56px 10px 26px;
  }
  .hero .kicker{
    font-size:.85rem; color:var(--ink-soft); margin-bottom:10px;
  }
  .hero h1{
    font-weight:700;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    line-height:1.3; margin:0 0 14px; color:var(--ink);
    text-shadow: 0 0 18px rgba(255,45,85,0.45);
  }
  .hero p.sub{
    max-width:480px; margin:0 auto; color:var(--ink-soft);
    font-size:1rem; line-height:1.65;
  }
  .hero-actions{
    margin-top:24px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  .pill-btn{
    font-family:inherit; font-weight:700; font-size:.9rem;
    background:var(--card); border:1px solid var(--line); color:var(--ink);
    padding:10px 20px; border-radius:999px; cursor:pointer;
    box-shadow:var(--shadow); transition: transform .15s ease, border-color .15s ease;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  }
  .pill-btn:hover{ transform:translateY(-1px); border-color:var(--accent); }
  .pill-btn.solid{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .section-head{ text-align:left; margin:56px 0 24px; }
  .section-head h2{
    font-weight:700; font-size:1.4rem; margin:0 0 4px;
  }
  .section-head p{ color:var(--ink-soft); margin:0; font-size:.92rem; }
  .roster{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px 16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .avatar{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff; font-size:1.1rem;
    background:linear-gradient(135deg, var(--accent), #7A0C2E);
    overflow:hidden; border:1px solid var(--line);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .card .name{ font-weight:700; font-size:1.05rem; }
  .card .nickname{ font-size:.85rem; color:var(--accent); font-weight:700; }
  .card .bio{
    font-size:.92rem; color:var(--ink-soft); line-height:1.55; min-height:54px;
  }
  .card .tiktok-link{
    align-self:flex-start; font-size:.82rem; font-weight:700; color:var(--ink);
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    border-bottom:1px solid var(--accent);
  }
  .footer{
    margin-top:60px; text-align:center; color:var(--ink-soft); font-size:.85rem;
    padding-top:22px; border-top:1px solid var(--line);
  }
  .footer strong{ color:var(--ink); }
</style>
</head>

const grid = document.getElementById('rosterGrid');

function initials(name){
  return name.trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();
}

students.forEach((s) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="avatar">${s.photo ? `<img src="${s.photo}" alt="${s.name}">` : initials(s.name)}</div>
    <div class="name">${s.name}</div>
    <div class="nickname">${s.nickname}</div>
    <div class="bio">${s.funny}</div>
    ${s.tiktok ? `<a class="tiktok-link" href="${s.tiktok}" target="_blank" rel="noopener">▶ xem TikTok</a>` : ''}
  `;
  grid.appendChild(card);
});
const field = document.getElementById('sparkleField');
const glyphs = ['🥶','☠️','♟️','😈'];
for(let i=0;i<18;i++){
  const el = document.createElement('div');
  el.className = 'sparkle';
  el.textContent = glyphs[i % glyphs.length];
  el.style.left = Math.random()*100 + 'vw';
  el.style.animationDelay = (Math.random()*12) + 's';
  el.style.animationDuration = (9 + Math.random()*7) + 's';
  field.appendChild(el);
}
function playChime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.12);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + i*0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.12 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.12);
      osc.stop(ctx.currentTime + i*0.12 + 0.4);
    });
  }catch(e){ }
}
